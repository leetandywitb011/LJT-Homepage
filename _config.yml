# Site Settings
locale: "en-US"
title: "Junteng Liu"
title_separator: "|"
subtitle: "PhD Candidate in Computer Science @ HKUST"
name: "Junteng Liu"
description: "First-year PhD candidate at HKUST NLP Group, researching natural language processing and machine learning. Research interests include LLM reasoning, vision-language model hallucination, and LLM truthfulness & interpretability."
url: "https://leetandywitb011.github.io"
baseurl: "/LJT-Homepage"
repository: "leetandywitb011/LJT-Homepage"

# Author
author:
  name: "Junteng Liu"
  bio: "First-year PhD candidate at the HKUST NLP Group, working on natural language processing and machine learning. His research interests include LLM reasoning and reinforcement learning, hallucination in vision-language models, as well as LLM truthfulness and interpretability."
  location: "Hong Kong SAR, China"
  email: "jliugi@connect.ust.hk"

# Social Links
social:
  type: "Person"
  name: "Junteng Liu"
  links:
    - "https://github.com/Vicent0205"
    - "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - "https://twitter.com/junteng88716710"

twitter:
  username: "junteng88716710"

github:
  username: "Vicent0205"

# Build settings
markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "default"

# Outputting
permalink: /:categories/:title/
paginate: 10
paginate_path: /page:num/
timezone: "Asia/Hong_Kong"

include:
  - _pages
  - _posts
  - _publications

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - Capfile
  - Gemfile
  - Gemfile.lock
  - node_modules
  - CHANGELOG
  - LICENSE
  - README
  - Rakefile
  - tmp
  - .git
  - .github

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jemoji

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: "_publications"
      type: publications
    values:
      layout: single
      author_profile: true
